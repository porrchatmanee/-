<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8" />
    <script>
      // CRITICAL: Prevent execution of cached old code
      (function() {
        const REQUIRED_VER = '20261002_REV14';
        const currentVer = localStorage.getItem('app_version_cache');
        if (currentVer !== REQUIRED_VER) {
          console.log('Cache mismatch in head, clearing and reloading...');
          localStorage.clear();
          localStorage.setItem('app_version_cache', REQUIRED_VER);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for(var i = 0; i < regs.length; i++) regs[i].unregister();
              window.location.reload(true);
            });
          } else {
            window.location.reload(true);
          }
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUKJAI Hub - Ward Inventory</title>
  </head>
  <body>
    <div id="app-v7"></div>
    <script type="module" src="/src/main.tsx?v=20261002_rev14"></script>
  </body>
</html>
